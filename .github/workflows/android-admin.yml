name: android-admin

on:
  push:
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-admin.yml'
  pull_request:
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-admin.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Create placeholder config (secrets are never used in CI)
        run: |
          printf 'supabase.url=https://ci.invalid\nsupabase.anonKey=ci-placeholder\ndeveloper.email=ci@example.com\n' > local.properties
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1:android:0000000000000000",
                  "android_client_info": { "package_name": "com.crispyburger.admin" }
                },
                "api_key": [ { "current_key": "ci-placeholder" } ]
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android-admin/app/build/reports/tests/
